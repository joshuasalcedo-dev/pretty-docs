# Generates this repository's own documentation with the plugin it builds, and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pretty-site/package-lock.json

      - name: Build and install the plugin
        run: mvn -B -ntp install -Dgpg.skip -DskipTests

      - name: Generate the documentation
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=revision -DforceStdout)
          mvn -B -ntp "io.joshuasalcedo.pretty:pretty-docs-maven-plugin:${VERSION}:generate"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pretty-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
